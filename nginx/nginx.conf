user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large audio uploads up to 30MB
    client_max_body_size 30M;

    # Backend upstream connecting to the Python container
    upstream deepfake_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve Django admin static files directly (bypassing Python)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        # Serve user-uploaded media files directly
        location /media/ {
            alias /app/media/;
            expires 30d;
            access_log off;
        }

        # Proxy all other requests to the backend (FastAPI/Django)
        location / {
            proxy_pass http://deepfake_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (useful if added later)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Increase timeouts since deep learning inference can take seconds
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
